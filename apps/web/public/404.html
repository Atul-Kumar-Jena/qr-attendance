<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendly</title>
  <script>
    // GitHub Pages SPA redirect: store the deep-link path in sessionStorage,
    // then bounce to the root so the React app can handle it via DeepLinkRestore.
    (function () {
      var base = '/qr-attendance';
      var path = window.location.pathname;
      var route = path.startsWith(base) ? path.slice(base.length) : path;
      if (!route || route === '/') route = '/';
      var search = window.location.search || '';
      var hash   = window.location.hash   || '';
      try {
        sessionStorage.setItem('atd_redirect', route + search + hash);
      } catch (e) {}
      window.location.replace(base + '/?_r=1');
    })();
  </script>
</head>
<body></body>
</html>
