name: attendly
description: Attendance, unforgeable.
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI / Fonts
  google_fonts: ^6.2.1

  # State
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_messaging: ^15.0.2

  # QR
  mobile_scanner: ^5.1.0
  qr_flutter: ^4.1.0

  # Location
  geolocator: ^12.0.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Device info
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # HTTP
  http: ^1.2.1

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.1
  permission_handler: ^11.3.1
  local_auth: ^2.3.0

  # Charts
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
